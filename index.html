<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TRT 8 · Analista de TI — Conteúdo programático</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8edf0;--panel:#fff;--ink:#14213d;--mute:#5a6578;--line:#cfd7de;--cl:92%;--cd:38%;--chip-ink:#14213d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151d;--panel:#182029;--ink:#e8edf2;--mute:#97a3b3;--line:#2a3542;--cl:22%;--cd:68%;--chip-ink:#e8edf2}}
:root[data-theme="dark"]{--bg:#10151d;--panel:#182029;--ink:#e8edf2;--mute:#97a3b3;--line:#2a3542;--cl:22%;--cd:68%;--chip-ink:#e8edf2}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 "Source Sans 3",system-ui,sans-serif}
header{padding:40px 20px 24px;max-width:1180px;margin:0 auto}
h1{font:800 clamp(2rem,5vw,3.4rem)/1 "Bricolage Grotesque",system-ui,sans-serif;margin:0 0 10px;letter-spacing:-.02em}
header p{margin:0;color:var(--mute);max-width:60ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar div{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar button,.bar input{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:6px 12px}
.bar button{cursor:pointer}.bar button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar input{flex:1;min-width:150px}
:focus-visible{outline:3px solid hsl(210 90% 55%);outline-offset:2px}
main{max-width:1180px;margin:0 auto;padding:8px 20px 60px}
.blk{font:700 1.1rem "Bricolage Grotesque",sans-serif;margin:36px 0 4px;color:var(--mute)}
.mat{display:grid;grid-template-columns:230px 1fr;gap:0;margin:16px 0;background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.side{background:hsl(var(--h) 55% var(--cl));border-right:6px solid hsl(var(--h) 60% var(--cd));padding:20px}
.side h2{font:800 1.35rem/1.15 "Bricolage Grotesque",sans-serif;margin:0 0 8px}
.side small{color:var(--mute);display:block}
.grp{padding:16px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px 28px;align-content:start}
.grp h3{font:700 .95rem "Bricolage Grotesque",sans-serif;margin:0 0 8px;color:hsl(var(--h) 55% var(--cd))}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:hsl(var(--h) 50% var(--cl));color:var(--chip-ink);border-radius:6px;padding:3px 9px;font-size:.88rem;line-height:1.35}
.chips span.off{opacity:.18}
.mat.hide{display:none}
@media (max-width:760px){.mat{grid-template-columns:1fr}.side{border-right:0;border-bottom:6px solid hsl(var(--h) 60% var(--cd))}.grp{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
<h1>TRT 8 · Analista Judiciário<br>Tecnologia da Informação</h1>
<p>Cargo 04 — Área Apoio Especializado. Conteúdo programático separado por matéria e subtema.</p>
</header>
<div class="bar"><div>
<button data-f="all" aria-pressed="true">Todas</button>
<button data-f="g" aria-pressed="false">Conhecimentos Gerais</button>
<button data-f="e" aria-pressed="false">Conhecimentos Específicos</button>
<input id="q" type="search" placeholder="Buscar tópico (ex.: Kubernetes, LGPD)" aria-label="Buscar tópico">
</div></div>
<main id="app"></main>
<script>
const D=[
{b:"g",t:"Língua Portuguesa",h:12,g:[

["Organização do Estado",["Organização político-administrativa","Competências da União, Estados e Municípios"]]]},
{b:"e",t:"Direito Administrativo",h:25,g:[
["Fundamentos",["Administração Pública","Regime jurídico administrativo","Princípios constitucionais, legais e implícitos","LINDB (Decreto-Lei 4.657/1942)"]],

{b:"e",t:"Tecnologia da Informação",h:215,g:[

["Programação",["Python","Java","JavaScript","TypeScript","Sintaxe, compilação e execução","Tipos primitivos, variáveis, literais e strings","Operadores e precedência","Controle de fluxo e repetição","Classes, interfaces, métodos","Encapsulamento, packages, sobrecarga e sobrescrita","Bibliotecas e componentes","Exceções","Acesso a banco de dados","Git"]],

["Nuvem computacional",["Arquitetura e computação em nuvem","Nuvem pública e privada","IaaS, PaaS, SaaS","Aplicações em nuvem e contêineres","Kubernetes","Docker","Serverless Framework"]],
["Segurança da informação",["ISO 27001:2024 e 27002:2022","ISO 27701:2026","LGPD (Lei 13.709/2018)","OWASP Top 10:2025","Desenvolvimento seguro e programação defensiva","Firewall, WAF, UTM, DMZ, Proxy, NAC","Antivírus e AntiSpam","IDS e IPS","Monitoramento de tráfego e sniffer","Segurança wireless: WPA2, WPA3 (EAP, WEP, WPA legados)","VPN, VPN-SSL, ZTNA","Interpretação de pacotes","Ataques e ameaças, códigos maliciosos","DoS e DDoS","Criptografia simétrica e assimétrica","Certificados e assinaturas digitais","Hashes criptográficos","Autenticação, autorização, auditoria, RBAC, MFA","TLS 1.2 e 1.3 (SSL histórico)"]],
["Normativos PDPJ-Br",["Res. CNJ 522/2023","Res. CNJ 335/2020","Portaria CNJ 252/2020","Portaria CNJ 253/2020","Portaria CNJ 131/2021","Res. CNJ 396/2021","Portaria CNJ 162/2021"]]]}
];
const app=document.getElementById('app'),q=document.getElementById('q');
const heads={g:"Conhecimentos Gerais",e:"Conhecimentos Específicos — Analista de TI"};
let last="";
D.forEach(m=>{
 if(m.b!==last){last=m.b;app.insertAdjacentHTML('beforeend',`<div class="blk" data-b="${m.b}">${heads[m.b]}</div>`)}
 const n=m.g.reduce((a,x)=>a+x[1].length,0);
 app.insertAdjacentHTML('beforeend',`<section class="mat" data-b="${m.b}" style="--h:${m.h}"><div class="side"><h2>${m.t}</h2><small>${m.g.length} subtemas · ${n} tópicos</small></div><div class="grp">${m.g.map(x=>`<div><h3>${x[0]}</h3><div class="chips">${x[1].map(c=>`<span>${c}</span>`).join('')}</div></div>`).join('')}</div></section>`);
});
let flt="all";
function apply(){
 const t=q.value.trim().toLowerCase();
 document.querySelectorAll('.mat').forEach(s=>{
  let hit=false;
  s.querySelectorAll('.chips span').forEach(c=>{const ok=!t||c.textContent.toLowerCase().includes(t);c.classList.toggle('off',!ok);if(ok)hit=true});
  s.classList.toggle('hide',(flt!=='all'&&s.dataset.b!==flt)||!hit);
 });
 document.querySelectorAll('.blk').forEach(b=>{b.style.display=(flt==='all'||b.dataset.b===flt)?'':'none'});
}
q.oninput=apply;
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{flt=b.dataset.f;document.querySelectorAll('.bar button').forEach(x=>x.setAttribute('aria-pressed',x===b));apply()});
</script>
</body>
</html>
